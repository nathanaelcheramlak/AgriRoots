name: Verify backend advisory workflow
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: agriroots
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: agriroots_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r backend/requirements-connectors.lock
      - run: python -m pip install pytest==9.0.3
      - run: python scripts/evaluate.py
      - run: python scripts/evaluate.py --output backend/validation/ci-postgres.json
        env:
          AGRIROOTS_TEST_DATABASE_URL: postgresql+psycopg://agriroots:synthetic-ci-only@127.0.0.1:5432/agriroots_test
      - run: python scripts/check_artifacts.py
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agrilo-fieldops-frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: agrilo-fieldops-frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
          VITE_API_MODE: mock
      - run: npm run test:layout
