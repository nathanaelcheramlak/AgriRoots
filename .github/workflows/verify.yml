name: Verify advisory workflow
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cold_start:
        description: Run full uncached model download and browser workflow
        type: boolean
        default: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: agriroots
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: agriroots_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - run: python -m pip install -r backend/requirements-demo.lock
      - run: python scripts/evaluate.py
      - run: python scripts/evaluate.py --output backend/validation/ci-postgres.json
        env:
          AGRIROOTS_TEST_DATABASE_URL: postgresql+psycopg://agriroots:synthetic-ci-only@127.0.0.1:5432/agriroots_test
      - run: npm ci && npm run lint && npm run build
        working-directory: frontend
      - run: python scripts/check_artifacts.py
  cold-start:
    if: github.event_name == 'workflow_dispatch' && inputs.cold_start
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - name: Fresh installation, model download and actual readiness
        run: python3 scripts/demo.py --check
      - name: Real browser workflow with offline speech
        run: |
          python3 scripts/demo.py > /tmp/agriroots-demo.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid"; wait "$demo_pid" || true' EXIT
          for attempt in $(seq 1 180); do
            if grep -q '^READY:' /tmp/agriroots-demo.log; then break; fi
            kill -0 "$demo_pid"
            sleep 1
          done
          grep -q '^READY:' /tmp/agriroots-demo.log
          npm --prefix scripts/browser ci
          node scripts/browser/node_modules/playwright/cli.js install --with-deps chromium
          CHROME_PATH="$(node --input-type=module -e 'import {chromium} from "./scripts/browser/node_modules/playwright/index.mjs";process.stdout.write(chromium.executablePath())')" VALIDATION_PREFIX=ci npm --prefix scripts/browser test
