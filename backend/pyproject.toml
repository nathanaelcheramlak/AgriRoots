[project]
name = "agrilo-backend"
version = "0.4.0"
description = "AgriLo office-scoped agricultural companion and reviewed connectors"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.136.0",
  "uvicorn==0.46.0",
  "pydantic==2.13.3",
  "pydantic-settings==2.14.0",
  "SQLAlchemy==2.0.49",
  "psycopg[binary,pool]==3.2.13",
  "psycopg2-binary==2.9.12",
  "httpx==0.28.1",
  "mcp==1.29.0",
  "mcp-server-fetch==2026.10.10",
  "google-genai==1.74.0",
  "langgraph==1.1.10",
  "langchain-core==1.3.2",
  "langgraph-checkpoint==4.0.3",
  "langsmith==0.8.0",
  "xxhash==3.7.0",
  "ormsgpack==1.12.2",
  "orjson==3.11.8",
  "starlette==1.0.0",
  "langgraph-checkpoint-postgres>=3,<4",
  "cryptography==47.0.0",
  "langgraph-checkpoint-sqlite>=3,<4",
  "jsonschema>=4.26,<5",
  "jsonpointer==3.1.1",
  "redis>=7,<8",
  "PyJWT==2.12.1",
  "passlib==1.7.4",
  "bcrypt==4.0.1",
  "python-dotenv==1.2.2",
  "python-multipart==0.0.26",
  "email-validator==2.3.0",
  "google-cloud-speech==2.39.0",
  "google-cloud-texttospeech==2.36.0",
  "pillow==12.2.0",
  "espeakng-loader==0.2.4",
  "shapely>=2.1,<3",
  "pyproj>=3.7,<4",
  "alembic>=1.16,<2",
]

[project.optional-dependencies]
vision = ["torch>=2.11,<3", "torchvision>=0.26,<1", "timm>=1,<2"]
raster = ["rasterio==1.5.2"]
earthengine = ["earthengine-api==1.7.52"]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.15,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["live: opt-in real provider requests", "postgres: requires a disposable PostgreSQL database"]
