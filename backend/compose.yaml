name: agrilo-connectors
services:
  postgres:
    image: agrilo-postgis:16
    build:
      context: .
      dockerfile: Dockerfile.postgis
    environment:
      POSTGRES_DB: agrilo
      POSTGRES_USER: agrilo_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your ignored environment}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U agrilo_owner -d agrilo]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redisdata:/data]
    networks: [internal]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: [python, -m, src.cli.connector_setup]
    environment: &environment
      APP_ENV: ${APP_ENV:-production}
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://agrilo_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}@postgres:5432/agrilo
      MIGRATION_DATABASE_URL: postgresql+psycopg://agrilo_owner:${POSTGRES_PASSWORD}@postgres:5432/agrilo
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?Set SECRET_ENCRYPTION_KEY}
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      LLM_PROVIDER: gemini
      CLOUD_MODEL_DATA_POLICY: synthetic_only
      OUTBOUND_ALLOWED_HOSTS: '${OUTBOUND_ALLOWED_HOSTS:-["api.open-meteo.com","power.larc.nasa.gov","api.isda-africa.com","climateserv.servirglobal.net","fpma.fao.org","www.arcgis.com","services5.arcgis.com"]}'
      CORS_ALLOWED_ORIGINS: '${CORS_ALLOWED_ORIGINS:-["http://localhost:5173"]}'
      LIVE_TESTS_ENABLED: ${LIVE_TESTS_ENABLED:-false}
      LIVE_MODEL_TESTS_ENABLED: ${LIVE_MODEL_TESTS_ENABLED:-false}
      LIVE_DIAGNOSIS_TESTS_ENABLED: "false"
      EXTERNAL_ACTIONS_ENABLED: "false"
      CONNECTOR_ARTIFACT_ROOT: /app/private-data/connectors
      CONNECTOR_CHECKPOINT_PREPARED: "true"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal]
  api:
    build: .
    command: [python, -m, uvicorn, src.main:app, --host, 0.0.0.0, --port, "8000"]
    environment:
      <<: *environment
      MIGRATION_DATABASE_URL: ""
      INTERNAL_MCP_URL: http://mcp:8003/mcp/
    ports: ["127.0.0.1:8000:8000"]
    volumes: [private:/app/private-data]
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [internal, outbound]
  worker:
    build: .
    command: [python, -m, src.cli.connector_worker]
    environment:
      <<: *environment
      MIGRATION_DATABASE_URL: ""
      INTERNAL_MCP_URL: http://mcp:8003/mcp/
    volumes: [private:/app/private-data]
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [internal, outbound]
  mcp:
    build: .
    command: [python, -m, src.mcp.http_server]
    environment:
      <<: *environment
      MIGRATION_DATABASE_URL: ""
    volumes: [private:/app/private-data]
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [internal, outbound]
volumes:
  pgdata:
  redisdata:
  private:
networks:
  internal: {internal: true}
  outbound:
